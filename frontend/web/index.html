<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>店铺管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div>
          <h1>订单录入与导出</h1>
          <p>电脑批量上传照片、填写或导入表格；手机按卡片拍照录入，扫码后自动带出商品基础资料。</p>
        </div>
        <button id="refreshAll" class="ghost">刷新</button>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="orders">订单</button>
        <button class="tab" data-tab="products">商品库</button>
        <button class="tab" data-tab="inventory">库存</button>
        <button class="tab" data-tab="delivery">送货</button>
      </nav>

      <section id="orders" class="view active">
        <form id="orderForm" class="panel wide">
          <h2>订单信息</h2>
          <input type="hidden" name="id" />
          <div class="pair">
            <label>单号<input name="orderNo" placeholder="留空自动生成" /></label>
            <label>客户名称<input name="customerName" required /></label>
          </div>
          <div class="pair">
            <label>电话<input name="customerPhone" /></label>
            <label>联系人<input name="contactName" /></label>
          </div>
          <div class="pair">
            <label>付款方式<input name="paymentMethod" /></label>
            <label>下单时间<input name="orderTime" type="date" /></label>
          </div>
          <div class="pair">
            <label>送货时间<input name="deliveryTime" type="date" /></label>
            <label>类型
              <select name="type">
                <option value="order">订单</option>
                <option value="quote">报价单</option>
              </select>
            </label>
          </div>
          <label>公司地址<input name="companyAddress" /></label>
          <label>送货地址<input name="deliveryAddress" /></label>
          <label>备注<textarea name="notes"></textarea></label>

          <div class="upload-grid">
            <label>正唛图片<input id="frontMarkUpload" type="file" accept="image/*" capture="environment" /></label>
            <label>侧唛图片<input id="sideMarkUpload" type="file" accept="image/*" capture="environment" /></label>
            <label>条码图片/文件<input id="barcodeUpload" type="file" accept="image/*,.pdf,.xls,.xlsx" /></label>
          </div>
          <input type="hidden" name="frontMarkImagePath" />
          <input type="hidden" name="sideMarkImagePath" />
          <input type="hidden" name="barcodeFilePath" />

          <div class="line-title">
            <h2>产品明细</h2>
            <div class="actions compact-actions">
              <button id="batchImages" type="button" class="ghost">批量照片</button>
              <button id="addItem" type="button" class="round">+</button>
            </div>
          </div>
          <input id="batchImagesInput" type="file" accept="image/*" multiple hidden />
          <div id="orderItems" class="item-list"></div>
          <div class="total">
            <span>总体积：<b id="totalCbm">0.000</b></span>
            <span>总件数：<b id="totalPieces">0</b></span>
            <span>总金额：<b id="orderTotal">0.00</b></span>
          </div>
          <div class="actions">
            <button class="primary" type="submit">保存订单</button>
            <button id="exportExcel" type="button" class="ghost">导出 Excel</button>
            <button id="exportPdf" type="button" class="ghost">导出 PDF</button>
          </div>
        </form>

        <section class="panel">
          <h2>订单列表</h2>
          <div id="orderList" class="list"></div>
        </section>
      </section>

      <section id="products" class="view">
        <form id="productForm" class="panel">
          <h2>商品库</h2>
          <input type="hidden" name="id" />
          <label>条形码<input name="barcode" /></label>
          <label>厂家货号<input name="factoryItemNo" required /></label>
          <label>产品照片<input id="productImageUpload" type="file" accept="image/*" capture="environment" /></label>
          <input type="hidden" name="productImagePath" />
          <input type="hidden" name="exportImagePath" />
          <label>产品描述<textarea name="description"></textarea></label>
          <div class="pair">
            <label>内装<input name="innerPack" /></label>
            <label>装箱数<input name="cartonQty" type="number" value="0" /></label>
          </div>
          <div class="pair">
            <label>单件体积<input name="cbmPerCarton" type="number" step="0.001" value="0" /></label>
            <label>单件件数<input name="unitPieces" type="number" value="0" /></label>
          </div>
          <div class="pair">
            <label>库存<input name="stock" type="number" value="0" /></label>
            <label>货位<input name="location" /></label>
          </div>
          <button class="primary" type="submit">保存商品</button>
        </form>
        <section class="panel">
          <h2>商品列表</h2>
          <div id="productList" class="list"></div>
        </section>
      </section>

      <section id="inventory" class="view">
        <section class="panel full">
          <h2>库存概览</h2>
          <input id="inventorySearch" placeholder="按商品名或条码搜索" />
          <div id="inventoryList" class="list"></div>
        </section>
      </section>

      <section id="delivery" class="view">
        <section class="panel full">
          <h2>今日送货</h2>
          <div id="deliveryList" class="list"></div>
        </section>
      </section>
    </main>

    <template id="itemTemplate">
      <article class="item-card">
        <div class="item-head">
          <strong class="item-title">产品</strong>
          <button type="button" class="danger remove-item">删除</button>
        </div>
        <div class="pair">
          <label>条码<input name="barcode" placeholder="扫码或输入条码" /></label>
          <div class="scan-actions">
            <button type="button" class="ghost scan">扫码</button>
            <button type="button" class="ghost lookup">查商品</button>
          </div>
        </div>
        <label>产品照片<input name="photoFile" type="file" accept="image/*" capture="environment" /></label>
        <input type="hidden" name="productId" />
        <input type="hidden" name="productImagePath" />
        <input type="hidden" name="exportImagePath" />
        <div class="photo-preview"></div>
        <div class="pair">
          <label>客人货号<input name="customerItemNo" /></label>
          <label>厂家货号<input name="factoryItemNo" /></label>
        </div>
        <label>产品描述<textarea name="productDescription"></textarea></label>
        <div class="grid-3">
          <label>内装<input name="innerPack" /></label>
          <label>装箱数<input name="cartonQty" type="number" value="0" /></label>
          <label>件数<input name="cartons" type="number" value="0" /></label>
        </div>
        <div class="grid-3">
          <label>单价<input name="unitPrice" type="number" step="0.01" value="0" /></label>
          <label>单件体积<input name="cbmPerCarton" type="number" step="0.001" value="0" /></label>
          <label>单件件数<input name="unitPieces" type="number" value="0" /></label>
        </div>
        <div class="grid-3">
          <label>总体积<input name="totalCbm" type="number" step="0.001" value="0" /></label>
          <label>总件数<input name="totalPieces" type="number" value="0" /></label>
          <label>总金额<input name="totalAmount" type="number" step="0.01" value="0" /></label>
        </div>
      </article>
    </template>

    <div id="scannerModal" class="scanner-modal" hidden>
      <div class="scanner-box">
        <video id="scannerVideo"></video>
        <button id="stopScanner" class="danger" type="button">停止扫码</button>
      </div>
    </div>

    <script src="/vendor/zxing/zxing-browser.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>

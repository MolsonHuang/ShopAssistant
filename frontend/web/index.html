<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>店铺管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <h1>ShopAssistant</h1>
        <button class="nav active" data-tab="orders">订单表格</button>
        <button class="nav" data-tab="products">商品库</button>
        <button class="nav" data-tab="delivery">送货仓库</button>
        <button class="nav" data-tab="accounting">会计统计</button>
        <button class="nav" data-tab="settings">权限设置</button>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <button id="menuToggle" class="ghost menu-btn">功能</button>
          <div>
            <strong id="pageTitle">订单表格</strong>
            <span id="roleHint">当前角色：老板，可见全部页面</span>
          </div>
          <label class="top-role">角色
            <select id="activeRoleSelect"></select>
          </label>
          <button id="refreshAll" class="ghost">刷新</button>
        </header>

        <section id="orders" class="view active">
          <form id="orderForm" class="panel">
            <input type="hidden" name="id" />
            <div class="contract-head">
              <div>
                <h2>义乌市展邦圣诞工艺品合同</h2>
                <p>Yiwu Zhanbang Christmas Ornaments Sales Confirmation</p>
              </div>
              <label>客户名称<input name="customerName" required /></label>
              <label>单号<input name="orderNo" placeholder="留空自动生成" /></label>
            </div>

            <div class="form-grid">
              <label>采购联系人<input name="contactName" /></label>
              <label>采购联系电话<input name="customerPhone" /></label>
              <label>付款方式<input name="paymentMethod" /></label>
              <label>下单日期<input name="orderTime" type="date" /></label>
              <label>公司地址<input name="companyAddress" /></label>
              <label>交货地址<input name="deliveryAddress" /></label>
              <label>交货日期<input name="deliveryTime" type="date" /></label>
              <label>付款状态
                <select name="paidStatus">
                  <option value="unpaid">未付款</option>
                  <option value="partial">部分付款</option>
                  <option value="paid">已付款</option>
                </select>
              </label>
              <label>已付金额<input name="paidAmount" type="number" step="0.01" value="0" /></label>
              <label class="wide-field">订单备注<input name="notes" placeholder="其他要求、临时说明、未归类信息" /></label>
            </div>

            <div class="mark-grid">
              <label>正唛图片<input id="frontMarkUpload" type="file" accept="image/*" capture="environment" /></label>
              <label>侧唛图片<input id="sideMarkUpload" type="file" accept="image/*" capture="environment" /></label>
              <label>条码/附件<input id="barcodeUpload" type="file" accept="image/*,.pdf,.xls,.xlsx" /></label>
            </div>
            <input type="hidden" name="frontMarkImagePath" />
            <input type="hidden" name="sideMarkImagePath" />
            <input type="hidden" name="barcodeFilePath" />

            <div class="table-tools">
              <div>
                <button id="addRow" type="button" class="primary">添加行</button>
                <button id="batchImages" type="button" class="ghost">批量照片</button>
                <input id="batchImagesInput" type="file" accept="image/*" multiple hidden />
              </div>
              <div>
                <button id="saveOrder" type="submit" class="primary">保存订单</button>
                <button id="exportExcel" type="button" class="ghost">导出 Excel</button>
                <button id="exportPdf" type="button" class="ghost">导出 PDF</button>
              </div>
            </div>

            <div class="sheet-wrap">
              <table id="orderSheet" class="order-sheet">
                <colgroup id="sheetCols"></colgroup>
                <thead id="sheetHead"></thead>
                <tbody id="sheetBody"></tbody>
                <tfoot id="sheetFoot"></tfoot>
              </table>
            </div>
            <div id="mobileItems" class="mobile-items"></div>
          </form>

          <section class="panel side-panel">
            <h2>订单列表</h2>
            <div id="orderList" class="list"></div>
          </section>
        </section>

        <section id="products" class="view">
          <section class="panel full">
            <h2>商品库</h2>
            <div id="productList" class="list grid-list"></div>
          </section>
        </section>

        <section id="delivery" class="view">
          <section class="panel full">
            <h2>送货与仓库验货</h2>
            <div id="deliveryList" class="delivery-grid"></div>
          </section>
        </section>

        <section id="accounting" class="view">
          <section class="panel full">
            <h2>会计统计</h2>
            <div id="accountingSummary" class="summary-grid"></div>
            <div id="accountingList" class="list"></div>
          </section>
        </section>

        <section id="settings" class="view">
          <section class="panel full">
            <h2>权限设置</h2>
            <div class="config-grid">
              <label>角色权限配置 JSON
                <textarea id="rolesConfig" class="config-editor"></textarea>
              </label>
              <label>订单表格配置 JSON
                <textarea id="tableConfig" class="config-editor"></textarea>
              </label>
            </div>
            <div class="actions">
              <button id="saveRolesConfig" type="button" class="primary">保存角色权限</button>
              <button id="saveTableConfig" type="button" class="primary">保存表格配置</button>
              <button id="resetConfig" type="button" class="ghost">恢复默认配置</button>
            </div>
            <p class="muted">微信扫码登录需要微信开放平台/公众号或企业微信配置回调域名。当前先预留角色权限框架，接入微信登录后可按账号绑定角色。</p>
          </section>
        </section>
      </section>
    </main>

    <dialog id="itemDialog">
      <form method="dialog" class="dialog-card">
        <h2>编辑产品</h2>
        <div id="dialogFields"></div>
        <div class="actions">
          <button id="saveDialogItem" type="button" class="primary">保存到表格</button>
          <button type="button" class="ghost" onclick="document.getElementById('itemDialog').close()">取消</button>
        </div>
      </form>
    </dialog>

    <div id="scannerModal" class="scanner-modal" hidden>
      <div class="scanner-box">
        <video id="scannerVideo"></video>
        <button id="stopScanner" class="danger" type="button">停止扫码</button>
      </div>
    </div>

    <script src="/vendor/zxing/zxing-browser.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
